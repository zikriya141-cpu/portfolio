<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a12"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- quiet backdrop ring -->
  <circle cx="800" cy="450" r="392" fill="none" stroke="#f472b6" stroke-opacity="0.08" stroke-width="2"/>

  <!-- task cards -->
  <g>
    <!-- card 1 · completed -->
    <rect x="470" y="248" width="660" height="118" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.07"/>
    <line x1="470" y1="248" x2="470" y2="366" stroke="#f472b6" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round"/>
    <circle cx="530" cy="307" r="17" fill="#f472b6" fill-opacity="0.9"/>
    <path d="M522 307 l6 7 12 -14" fill="none" stroke="#0a0a0c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="572" y="282" width="300" height="14" rx="7" fill="#ffffff" fill-opacity="0.2"/>
    <line x1="572" y1="289" x2="872" y2="289" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2"/>
    <rect x="572" y="314" width="190" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="1014" y="292" width="76" height="30" rx="15" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.3"/>

    <!-- card 2 · pending, active -->
    <rect x="470" y="396" width="660" height="118" rx="20" fill="#ffffff" fill-opacity="0.055" stroke="#f472b6" stroke-opacity="0.35"/>
    <circle cx="530" cy="455" r="17" fill="none" stroke="#f472b6" stroke-opacity="0.8" stroke-width="3"/>
    <circle cx="530" cy="455" r="6" fill="#f472b6" fill-opacity="0.85"/>
    <rect x="572" y="430" width="356" height="14" rx="7" fill="#ffffff" fill-opacity="0.42"/>
    <rect x="572" y="462" width="230" height="10" rx="5" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="1014" y="440" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>

    <!-- card 3 · pending -->
    <rect x="470" y="544" width="660" height="118" rx="20" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="530" cy="603" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <rect x="572" y="578" width="268" height="14" rx="7" fill="#ffffff" fill-opacity="0.26"/>
    <rect x="572" y="610" width="168" height="10" rx="5" fill="#ffffff" fill-opacity="0.09"/>
    <rect x="1014" y="588" width="76" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- add button -->
    <rect x="1034" y="690" width="72" height="72" rx="22" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.4"/>
    <g stroke="#f472b6" stroke-opacity="0.9" stroke-width="4" stroke-linecap="round">
      <line x1="1053" y1="726" x2="1087" y2="726"/>
      <line x1="1070" y1="709" x2="1070" y2="743"/>
    </g>
  </g>

  <!-- progress arc -->
  <g transform="translate(330, 452)" fill="none" stroke-linecap="round">
    <circle r="64" stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>
    <path d="M0 -64 A64 64 0 0 1 60 22" stroke="#f472b6" stroke-opacity="0.8" stroke-width="8"/>
  </g>
  <text x="330" y="462" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" fill-opacity="0.75">1/3</text>

  <g fill="#f472b6" fill-opacity="0.5">
    <circle cx="1290" cy="286" r="5"/>
    <circle cx="1330" cy="640" r="5"/>
    <circle cx="252" cy="742" r="5"/>
    <circle cx="1210" cy="806" r="5"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="72" y="852" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#ffffff" fill-opacity="0.95">TaskFlow</text>
    <text x="76" y="904" font-size="18" letter-spacing="5" fill="#f472b6">TASK MANAGER · NODE + SQLITE</text>
    <text x="1524" y="200" text-anchor="end" font-size="150" font-weight="700" fill="#ffffff" fill-opacity="0.05">06</text>
  </g>

  <rect width="1600" height="1000" filter="url(#nz)" opacity="0.045"/>
</svg>
