<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161207"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="green">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="3">
    <line x1="240" y1="360" x2="1400" y2="360"/>
    <line x1="240" y1="500" x2="1400" y2="500"/>
    <line x1="240" y1="640" x2="1400" y2="640"/>
    <line x1="240" y1="780" x2="1400" y2="780"/>
  </g>

  <g stroke="#fbbf24" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="26 26">
    <line x1="240" y1="430" x2="1400" y2="430"/>
    <line x1="240" y1="570" x2="1400" y2="570"/>
    <line x1="240" y1="710" x2="1400" y2="710"/>
  </g>

  <g>
    <rect x="250" y="300" width="96" height="250" rx="48" fill="#121216" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="298" cy="360" r="21" fill="#ef4444" fill-opacity="0.18"/>
    <circle cx="298" cy="425" r="21" fill="#fbbf24" fill-opacity="0.18"/>
    <circle cx="298" cy="490" r="34" fill="url(#green)"/>
    <circle cx="298" cy="490" r="21" fill="#4ade80"/>
  </g>

  <g fill="#fbbf24" fill-opacity="0.9">
    <rect x="640" y="392" width="150" height="64" rx="16"/>
    <rect x="1010" y="392" width="120" height="64" rx="16" fill-opacity="0.55"/>
    <rect x="760" y="532" width="170" height="64" rx="16"/>
    <rect x="1110" y="532" width="130" height="64" rx="16" fill-opacity="0.5"/>
    <rect x="620" y="672" width="140" height="64" rx="16" fill-opacity="0.55"/>
    <rect x="930" y="672" width="160" height="64" rx="16"/>
  </g>
  <g fill="#0a0a0c" fill-opacity="0.35">
    <rect x="700" y="404" width="46" height="40" rx="8"/>
    <rect x="820" y="544" width="52" height="40" rx="8"/>
    <rect x="990" y="684" width="48" height="40" rx="8"/>
  </g>

  <g stroke="#4ade80" stroke-opacity="0.45" stroke-width="3" fill="none">
    <path d="M1420 360 h60"/>
    <path d="M1480 360 l-16 -10"/>
    <path d="M1480 360 l-16 10"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="72" y="852" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#ffffff" fill-opacity="0.95">Traffic Intelligence</text>
    <text x="76" y="904" font-size="18" letter-spacing="5" fill="#fbbf24">FORECASTING · COMPUTER VISION</text>
    <text x="1524" y="200" text-anchor="end" font-size="150" font-weight="700" fill="#ffffff" fill-opacity="0.05">03</text>
  </g>

  <rect width="1600" height="1000" filter="url(#nz)" opacity="0.045"/>
