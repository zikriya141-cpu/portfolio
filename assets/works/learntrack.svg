<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120a1a"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.03"/>
    </pattern>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <circle cx="800" cy="446" r="372" fill="none" stroke="#c084fc" stroke-opacity="0.07" stroke-width="2"/>

  <!-- quiz panel -->
  <g>
    <rect x="470" y="225" width="660" height="430" rx="26" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <line x1="470" y1="256" x2="470" y2="624" stroke="#c084fc" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round"/>

    <!-- question lines -->
    <rect x="510" y="262" width="440" height="16" rx="8" fill="#ffffff" fill-opacity="0.32"/>
    <rect x="510" y="292" width="300" height="16" rx="8" fill="#ffffff" fill-opacity="0.13"/>

    <!-- progress -->
    <rect x="510" y="332" width="42" height="6" rx="3" fill="#c084fc" fill-opacity="0.75"/>
    <rect x="560" y="332" width="42" height="6" rx="3" fill="#c084fc" fill-opacity="0.75"/>
    <rect x="610" y="332" width="42" height="6" rx="3" fill="#ffffff" fill-opacity="0.12"/>

    <!-- option 1 -->
    <rect x="500" y="358" width="600" height="56" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="534" cy="386" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <rect x="566" y="379" width="400" height="14" rx="7" fill="#ffffff" fill-opacity="0.18"/>

    <!-- option 2 · chosen -->
    <rect x="500" y="424" width="600" height="56" rx="16" fill="#c084fc" fill-opacity="0.13" stroke="#c084fc" stroke-opacity="0.45"/>
    <circle cx="534" cy="452" r="16" fill="#c084fc" fill-opacity="0.9"/>
    <path d="M526 452 l6 7 12 -14" fill="none" stroke="#0a0a0c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="566" y="445" width="400" height="14" rx="7" fill="#ffffff" fill-opacity="0.46"/>

    <!-- option 3 -->
    <rect x="500" y="490" width="600" height="56" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.07"/>
    <circle cx="534" cy="518" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="566" y="511" width="330" height="14" rx="7" fill="#ffffff" fill-opacity="0.14"/>

    <!-- option 4 -->
    <rect x="500" y="556" width="600" height="56" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle cx="534" cy="584" r="16" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="566" y="577" width="250" height="14" rx="7" fill="#ffffff" fill-opacity="0.12"/>
  </g>

  <!-- score badge -->
  <g transform="translate(1188, 208)">
    <rect x="-52" y="-20" width="104" height="40" rx="20" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.35"/>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#c084fc" fill-opacity="0.9">3 / 4</text>
  </g>

  <g fill="#c084fc" fill-opacity="0.5">
    <circle cx="1310" cy="330" r="5"/>
    <circle cx="1272" cy="700" r="5"/>
    <circle cx="300" cy="318" r="5"/>
    <circle cx="352" cy="688" r="5"/>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="72" y="852" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#ffffff" fill-opacity="0.95">LearnTrack</text>
    <text x="76" y="904" font-size="18" letter-spacing="5" fill="#c084fc">LEARNING PLATFORM · NODE + SQLITE</text>
    <text x="1524" y="200" text-anchor="end" font-size="150" font-weight="700" fill="#ffffff" fill-opacity="0.05">07</text>
  </g>

  <rect width="1600" height="1000" filter="url(#nz)" opacity="0.045"/>
</svg>
